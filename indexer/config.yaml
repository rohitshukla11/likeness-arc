# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Likeness on Arc mainnet (chain 5042): all four protocol contracts from the deployment block.
#
# Data source: the RPC (ENVIO_RPC_FOR=sync, the default here). Arc's public endpoint serves
# eth_getLogs up to 10,000 blocks at a time (https://docs.arc.io/arc/references/rpc-endpoints.md).
name: likeness-indexer
contracts:
  - name: CreatorRegistry
    abi_file_path: ./abis/CreatorRegistry.json
    events:
      - event: CreatorRegistered
      - event: AttestationUpdated
      - event: TermsSet
      - event: PayoutSet
      - event: ActiveSet
      - event: AllRevoked
      - event: Suspended
  - name: LicenseRegistry
    abi_file_path: ./abis/LicenseRegistry.json
    events:
      - event: LicenceIssued
      - event: LicenceRevoked
      - event: RenderRecorded
  - name: LicenseEscrow
    abi_file_path: ./abis/LicenseEscrow.json
    events:
      - event: Deposited
      - event: RenderPaid
      - event: Refunded
      - event: RenderAgentSet
  - name: ReceiptAnchor
    abi_file_path: ./abis/ReceiptAnchor.json
    events:
      - event: ReceiptAnchored
field_selection:
  transaction_fields: [hash]
chains:
  - id: 5042
    start_block: ${ENVIO_START_BLOCK:-25968293}
    rpc:
      - url: ${ENVIO_RPC_URL:-https://rpc.mainnet.arc.io}
        for: ${ENVIO_RPC_FOR:-sync}
        initial_block_interval: 9999
        interval_ceiling: 9999
    contracts:
      - name: CreatorRegistry
        address: "0x87934d5E1A61be3Bb06FE54AC7e21E7704731d1C"
      - name: LicenseRegistry
        address: "0xE33Dc788C060cb77F79A2AFF96Ca685f6C018721"
      - name: LicenseEscrow
        address: "0x8a747D78811066F58A0dDe04E82165A02fA37725"
      - name: ReceiptAnchor
        address: "0x38703a57c5f8eB2F8d1576A3d2B4B35A10D66FA6"
